name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Node.js CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.x", "20.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Lint
        run: npm run lint --if-present

      - name: Validate package.json
        run: node -e "const p = require('./package.json'); console.log('package.json OK — name:', p.name, 'version:', p.version)"

      - name: Validate src/index.js syntax
        run: node --check src/index.js && echo 'src/index.js syntax OK'

      - name: Validate agent.json
        run: node -e "const a = require('./agent.json'); console.log('agent.json OK — name:', a.name, 'version:', a.version)"
